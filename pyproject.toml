[project]
name = "agentready"
version = "0.1.0"
description = "Agent-readiness audit & MCP layer for businesses"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "typer>=0.12",
]

[project.scripts]
agentready = "agentready.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentready"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
