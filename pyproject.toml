[project]
name = "beacon"
version = "0.1.0"
description = "Agent-readiness audit & MCP layer for businesses"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pyyaml>=6.0",
    "selectolax>=0.3",
    "typer>=0.12",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]

[project.scripts]
beacon = "beacon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
