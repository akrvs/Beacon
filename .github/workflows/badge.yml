name: agent visibility badge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    if: ${{ vars.BEACON_BADGE_DOMAIN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Audit the domain and refresh the badge
        env:
          DOMAIN: ${{ vars.BEACON_BADGE_DOMAIN }}
        run: |
          beacon score "$DOMAIN" > /dev/null
          beacon badge "$DOMAIN" --output badge.json
          beacon badge "$DOMAIN" --md --url "${BEACON_BADGE_RAW_URL:-https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/badge.json}" --output badge.md
      - name: Commit the badge when it changed
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add badge.json badge.md
          git diff --cached --quiet || git commit -m "chore: refresh agent visibility badge"
          git push
